[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "save-social-midias"
version = "0.4.0"
description = "SaveFlow: save public social videos at the highest quality available using yt-dlp and FFmpeg."
requires-python = ">=3.11"
dependencies = ["yt-dlp>=2025.3.0", "mcp>=1.0.0"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.12"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["server*"]
