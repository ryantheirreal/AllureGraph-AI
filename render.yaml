# Example infrastructure blueprint; no external deployment is created by this file.
services:
  - type: web
    name: saveflow-video-studio
    runtime: docker
    plan: 1c-2g
    healthCheckPath: /health
    disk:
      name: saveflow-media
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: SAVEFLOW_OUTPUT_DIR
        value: /data
      - key: SAVEFLOW_MAX_BYTES
        value: "524288000"
      - key: SAVEFLOW_UPLOAD_MAX_BYTES
        value: "209715200"
      - key: SAVEFLOW_API_TOKEN
        sync: false
      - key: SAVEFLOW_PUBLIC_URL
        sync: false
      - key: SAVEFLOW_ALLOWED_ORIGINS
        sync: false
